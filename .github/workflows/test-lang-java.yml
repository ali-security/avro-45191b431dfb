name: 'Test Java'
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated surefire test classes to run instead of the full suite (empty = full suite)'
        required: false
        default: ''

defaults:
  run:
    working-directory: lang/java

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java ${{ matrix.java }} Test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        java:
        - '8'
        - '11'
        - '17'
        - '18'
        - '19'
    steps:
      - uses: actions/checkout@v2

      - name: Cache Local Maven Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup Temurin JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Lint
        run: ./build.sh lint

      - name: Test
        env:
          # JDK 18 (EOL, last build 18.0.2.1) NPEs in its cgroup v2 detection on the
          # current ubuntu runner whenever a test asks for the OperatingSystemMXBean
          # (TestDataFileReader.testForLeakingFileDescriptors); container support off avoids that code path.
          JAVA_TOOL_OPTIONS: ${{ matrix.java == '18' && '-XX:-UseContainerSupport' || '' }}
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B test -Dtest="$(echo '${{ inputs.test-filter }}' | tr ' ' ',')" -Dsurefire.failIfNoSpecifiedTests=false
          else
            ./build.sh test
          fi

      - name: Package Avro jars
        if: matrix.java == '8'
        run: mvn -B package -DskipTests -pl avro

      - name: Upload Avro jars
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: avro-jars
          path: |
            lang/java/avro/target/avro-1.11.1.jar
            lang/java/avro/target/avro-1.11.1-tests.jar
          if-no-files-found: error

  interop:
    name: Java ${{ matrix.java }} Interop
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      matrix:
        java:
        - '8'
        - '11'
        - '17'
    steps:
      - uses: actions/checkout@v2

      - name: Cache Local Maven Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Setup Python for Generating Input Data
        uses: MatteoH2O1999/setup-python@v4

      - name: Apt Install Compression Libs Required by Python
        run: |
          sudo apt-get install -qqy --no-install-recommends libbz2-dev \
                                                            liblzma-dev \
                                                            libsnappy-dev \
                                                            libzstd-dev

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools tox-wheel
          python3 -m pip install python-snappy zstandard

      - name: Setup C# for Generating Interop Data
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: |
            3.1.x
            5.0.x
            6.0.x

      - name: Install Java Avro for Interop Test
        working-directory: .
        run: mvn -B install -DskipTests

      - name: Create Interop Data Directory
        working-directory: .
        run: mkdir -p build/interop/data

      - name: Generate Interop Resources
        working-directory: lang/java/avro
        run: mvn -B -P interop-data-generate generate-resources

      - name: Generate Interop Data using Python
        working-directory: lang/py
        run: ./build.sh interop-data-generate

      - name: Generate Interop Data using C#
        working-directory: lang/csharp
        run: ./build.sh interop-data-generate

      - name: Run Interop Tests
        working-directory: lang/java/ipc
        run: mvn -B test -P interop-data-test

      - name: Test Reproducible Build
        working-directory: .
        run: mvn clean verify -DskipTests artifact:compare
