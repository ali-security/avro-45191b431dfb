os: linux
dist: focal
group: edge
virt: vm
language: generic
sudo: false

before_cache:
  - sudo chown -R travis:travis $HOME/.m2
  - rm -rf $HOME/.m2/repository/org/apache/avro/

cache:
  apt: true
  directories:
    - ${HOME}/.m2
    - ${HOME}/.cpan

matrix:
  include:
    - name: Java
      addons:
        apt:
          update: true
          packages:
            - wget
      before_install:
        - lscpu
        # The Travis image ships without /usr/share/man/man1, which makes the
        # openjdk-8 postinst (update-alternatives man-page links) fail.
        - sudo mkdir -p /usr/share/man/man1
        - sudo apt-get install -yq --no-install-recommends openjdk-8-jdk
      env:
        - MAVEN_OPTS="-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      install:
        - export MAVEN_VERSION="3.8.3"
        - wget https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz
        - tar zxvf apache-maven-$MAVEN_VERSION-bin.tar.gz
        - export M2_HOME=$PWD/apache-maven-$MAVEN_VERSION
        - export JAVA_HOME="/usr/lib/jvm/java-8-openjdk-amd64"
        - export PATH="$M2_HOME/bin:$JAVA_HOME/bin:$PATH"
      before_script:
        - java -version
        - mvn -version
      script:
        - cd lang/java
        - ./build.sh clean test
      after_script:
        - echo "=== Skipped tests in the last run (mvn -B test -Phadoop2), with reasons ==="
        - |
          find . -path '*/target/surefire-reports/TEST-*.xml' -exec awk '/<testcase /{c=$0; sub(/.*classname="/,"",c); sub(/".*/,"",c); n=$0; sub(/.*<testcase name="/,"",n); sub(/".*/,"",n)} /<skipped/{m=$0; if (m ~ /message="/) {sub(/.*message="/,"",m); sub(/".*/,"",m)} else m="no message"; print "SKIPPED " c "." n ": " m}' {} +
        - |
          echo "Skip reasons for the entries surefire records with no message - TestSpecificRecordBuilder.testBuilderPerformance, testBuilderPerformanceWithDefaultValues, testManualBuildPerformance and TestNettyServerWithCallbacks.performanceTest are micro-benchmarks marked @Ignore upstream without a reason string; TestReflectLogicalTypes.testReadUUIDMissingLogicalTypeReflect skips itself via Assume.assumeTrue(getFieldAccess() instanceof FieldAccessReflect) because another test in the same JVM already selected the Unsafe field access"
        - |
          find . -path '*/target/surefire-reports/TEST-*.xml' -exec grep -h -o '<testsuite [^>]*' {} + | awk '{for(i=2;i<=NF;i++){split($i,kv,"=");v=kv[2];gsub(/"/,"",v);if(kv[1]=="tests")t+=v;else if(kv[1]=="failures")f+=v;else if(kv[1]=="errors")e+=v;else if(kv[1]=="skipped")s+=v}} END{printf "=== Surefire totals of the last run (mvn -B test -Phadoop2): Tests run: %d, Failures: %d, Errors: %d, Skipped: %d ===\n",t,f,e,s}'
        - |
          # Keep the job open until Travis has archived this job's log up to the
          # script result, so the harvested log carries the full test output.
          i=0
          while [ $i -lt 600 ]; do
            if curl -s "https://api.travis-ci.com/v3/job/${TRAVIS_JOB_ID}/log.txt" | grep -Eq 'clean test" exited with [0-9]'; then
              echo "log archived after ${i}s"; break
            fi
            echo "waiting for log archive... (${i}s)"
            sleep 20; i=$((i+20))
          done

before_install:
  - lscpu
